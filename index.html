<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pokémon España: En Busca del Legendario v7.3</title>
<style>
:root{
  --blue:#3B4CCA;
  --yellow:#FFDE00;
  --dark:#0A285F;
  --red:#CC0000;
  --green:#2d8a4e;
}
html,body{
  width:100%;
  min-height:100%;
  margin:0;
  padding:0;
}
*{box-sizing:border-box}
body{
  font-family:Arial, Helvetica, sans-serif;
  background:linear-gradient(135deg,#1a237e,#0a285f 50%,#1565c0);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:10px 8px 30px;
}
#gc{
  width:100%;
  max-width:560px;
  background:#fff;
  border-radius:20px;
  box-shadow:0 8px 32px rgba(10,40,95,.2),0 0 0 4px var(--yellow);
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
header{
  background:linear-gradient(135deg,var(--blue),var(--dark));
  color:#fff;
  padding:14px 15px 10px;
  text-align:center;
  border-bottom:4px solid var(--yellow);
}
header h1{
  margin:0;
  font-size:1rem;
  color:var(--yellow);
  line-height:1.5;
}
header p{
  margin:6px 0 0;
  font-size:.8rem;
  font-weight:700;
  opacity:.9;
}
#sb{
  background:var(--dark);
  color:#fff;
  padding:7px 12px;
  font-size:.82rem;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:800;
}
#cb{
  background:var(--red);
  padding:3px 10px;
  border-radius:12px;
  font-size:.72rem;
  font-weight:900;
  max-width:230px;
  text-align:right;
  line-height:1.3;
}
#top-actions{
  background:#10245f;
  padding:8px 12px;
  display:flex;
  gap:8px;
  justify-content:flex-end;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.ctrl-btn{
  border:none;
  border-radius:10px;
  padding:8px 10px;
  font-size:.78rem;
  font-weight:900;
  background:#ffffff;
  color:#0A285F;
}
#rp{
  background:#1a237e;
  padding:6px 12px;
  display:none;
  align-items:center;
  gap:5px;
  overflow-x:auto;
}
.rdot{
  width:24px;height:24px;border-radius:50%;
  border:2px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:center;
  font-size:.62rem;color:#fff;font-weight:900;flex-shrink:0;
}
.rdot.visited{background:var(--yellow);border-color:var(--yellow);color:#000}
.rdot.current{background:var(--green);border-color:#52d68a;color:#fff}
.rdot.unknown{background:rgba(255,255,255,.12);color:rgba(255,255,255,.4);border-color:rgba(255,255,255,.15)}
.rarr{color:rgba(255,255,255,.25);font-size:.65rem;flex-shrink:0}

#screen{
  padding:14px;
  flex-grow:1;
  min-height:260px;
  display:flex;
  flex-direction:column;
}
.scene{
  position:relative;
  width:100%;
  height:195px;
  border-radius:13px;
  overflow:hidden;
  margin-bottom:11px;
  background:linear-gradient(180deg,#9bd2ff 0%, #dff3ff 55%, #90c76f 56%, #7bb45b 100%);
  flex-shrink:0;
  border:2px solid #d8e6f2;
}
.scene-bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:0;
}
.scene-pattern{
  position:absolute;
  inset:0;
  z-index:1;
  background:
    linear-gradient(to top, rgba(0,0,0,.52), transparent 45%),
    radial-gradient(circle at 85% 20%, rgba(255,221,87,.45) 0 28px, transparent 29px),
    linear-gradient(to top, transparent 0 58%, rgba(255,255,255,.14) 58% 60%, transparent 60%);
}
.scene-label{
  position:absolute;
  left:10px;
  bottom:8px;
  color:#fff;
  font-size:.82rem;
  font-weight:900;
  text-shadow:1px 1px 4px rgba(0,0,0,.95);
  z-index:3;
}
.poke-img{
  position:absolute;
  bottom:8px;
  left:50%;
  transform:translateX(-50%);
  height:120px;
  width:auto;
  filter:drop-shadow(0 6px 16px rgba(0,0,0,.85));
  z-index:3;
}
.poke-badge{
  position:absolute;
  top:8px;
  right:8px;
  background:rgba(0,0,0,.75);
  color:var(--yellow);
  font-size:.65rem;
  font-weight:900;
  padding:4px 8px;
  border-radius:8px;
  border:1px solid var(--yellow);
  z-index:3;
}
.stext{
  font-size:.98rem;
  line-height:1.55;
  margin-bottom:11px;
  background:#f0f6ff;
  padding:11px 13px;
  border-left:5px solid var(--blue);
  border-radius:6px;
  font-weight:700;
}
.hbox{
  background:#fff9db;
  border:2px dashed #f59f00;
  padding:9px 12px;
  border-radius:8px;
  margin-bottom:10px;
  font-style:italic;
  font-size:.88rem;
  font-weight:700;
  color:#7c5a00;
}
.wbox{
  background:#fff0f0;
  border:2px dashed var(--red);
  padding:12px;
  border-radius:10px;
  margin-bottom:10px;
  text-align:center;
}
.opts{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}
button{
  background:#fff;
  border:2.5px solid var(--blue);
  border-radius:11px;
  padding:11px 13px;
  font-size:.94rem;
  font-weight:800;
  font-family:Arial, Helvetica, sans-serif;
  color:var(--dark);
  display:flex;
  align-items:center;
  gap:7px;
  cursor:pointer;
}
button:active{transform:scale(.98)}
.abtn{background:var(--yellow);border-color:var(--dark);color:var(--dark)}
.tbtn{background:#f1f5f9;border-color:#94a3b8;color:#334155;font-size:.88rem;padding:9px 12px}
.lbtn{background:#1a1a2e;border-color:#cc2244;color:#fff}
.sbtn{
  background:linear-gradient(135deg,var(--blue),var(--dark));
  color:var(--yellow);
  border:none;
  font-size:.8rem;
  padding:16px;
  border-radius:13px;
  margin-top:10px;
  text-align:center;
  justify-content:center;
  width:100%;
}
.slbl{font-weight:900;font-size:.82rem;color:#4a5568;margin:12px 0 5px;display:block}
.tcard{
  background:linear-gradient(135deg,#fff9db,#fffde7);
  border:3px solid var(--yellow);
  border-radius:13px;
  padding:13px;
  margin:8px 0;
  font-size:.9rem;
  font-weight:700;
  line-height:1.55;
}
.tcard.dark{
  background:linear-gradient(135deg,#1a1a2e,#2a2a4e);
  color:#fff;
  border-color:#cc2244;
}
#pdx-c{
  background:#edf2f7;
  padding:9px 12px;
  border-top:2px solid #e2e8f0;
}
.pdx-t{
  font-size:.65rem;
  font-weight:900;
  color:#4a5568;
  margin-bottom:5px;
  text-transform:uppercase;
  letter-spacing:.8px;
}
#pdx{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding-bottom:3px;
  min-height:36px;
}
.pslot{
  background:#fff;
  border:2px solid #cbd5e1;
  border-radius:7px;
  padding:4px 9px;
  font-size:.73rem;
  font-weight:900;
  white-space:nowrap;
  flex-shrink:0;
  min-width:72px;
  text-align:center;
}
.pslot.found{border-color:var(--red);background:#fff5f5;color:var(--red)}
.hidden{display:none!important}
#modal{
  position:fixed;
  top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,.72);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  z-index:100;
}
.mc{
  background:#fff;
  border-radius:18px;
  padding:22px;
  width:100%;
  max-width:400px;
  text-align:center;
  border:4px solid var(--blue);
  box-shadow:0 14px 40px rgba(0,0,0,.4);
}
.mt{
  font-size:.95rem;
  font-weight:bold;
  margin-bottom:12px;
  line-height:1.5;
}
.mt.ok{color:#38a169}
.mt.ko{color:#e53e3e}
.mx{font-size:.95rem;margin-bottom:14px;line-height:1.5;font-weight:700}
</style>
</head>

</div>

const state = {
  currentCity: "Madrid",
  discovered: [],
  secretRoute: [],
  routeIndex: 0,
  activePlaces: {},
  donePlaces: {},
  legendario: null,
  gameState: "start",
  placePokemon: {},
  reviewData: {},
  usedHintsByCity: {},
  musicEnabled: false
};

let activePlace = null;
let activePI = null;

function shuffle(arr){
  const copy = arr.slice();
  for(let i = copy.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const temp = copy[i];
    copy[i] = copy[j];
    copy[j] = temp;
  }
  return copy;
}

function pick3Places(cityKey) {
  return shuffle(CITY_POOL[cityKey].places).slice(0, 3);
}

function chooseQuestion(place) {
  if (!place.questions || !place.questions.length) return null;
  return place.questions[Math.floor(Math.random() * place.questions.length)];
}

function generateRoute() {
  const finals = ["Barcelona","Santiago de Compostela","Salamanca","Girona","Valencia"];
  const others = Object.keys(CITY_POOL).filter(function(c){
    return c !== "Madrid" && c !== "Londres" && finals.indexOf(c) === -1;
  });
  const finalCity = finals[Math.floor(Math.random() * finals.length)];
  const includeLondon = Math.random() < 0.35;
  let middle = shuffle(others).slice(0, includeLondon ? 2 : 3);
  if (includeLondon) {
    middle.splice(Math.floor(Math.random() * (middle.length + 1)), 0, "Londres");
  }
  return ["Madrid"].concat(middle).concat([finalCity]);
}

function placeKey(cityKey, placeIndex) {
  return cityKey + "__" + placeIndex;
}

function assignRandomPokemonToPlaces() {
  state.placePokemon = {};
  const needed = state.secretRoute.reduce(function(acc, cityKey){
    return acc + state.activePlaces[cityKey].length;
  }, 0);

  let pool = shuffle(RANDOM_POKEMON_POOL);
  while (pool.length < needed) {
    pool = pool.concat(shuffle(RANDOM_POKEMON_POOL));
  }

  let cursor = 0;
  state.secretRoute.forEach(function(cityKey){
    state.activePlaces[cityKey].forEach(function(_, i){
      state.placePokemon[placeKey(cityKey, i)] = pool[cursor++];
    });
  });
}

function getAssignedPokemon(cityKey, placeIndex) {
  return state.placePokemon[placeKey(cityKey, placeIndex)];
}

function saveReviewData(cityKey, placeIndex, pokemonName, clueText) {
  state.reviewData[placeKey(cityKey, placeIndex)] = { pokemonName, clueText };
}

function getNextRouteCity() {
  return state.secretRoute[state.routeIndex + 1] || null;
}

function isFinalRouteCity(cityKey) {
  return cityKey === state.secretRoute[state.secretRoute.length - 1] &&
         cityKey === state.secretRoute[state.routeIndex];
}

function getHintForCurrentCity() {
  const nextCity = getNextRouteCity();
  if (!nextCity) return "El rastro se vuelve difuso por un instante...";
  const clues = HINTS[nextCity] || ["El rastro se mueve a una ciudad desconocida..."];

  if (!state.usedHintsByCity[state.currentCity]) {
    state.usedHintsByCity[state.currentCity] = [];
  }

  const used = state.usedHintsByCity[state.currentCity];
  const available = clues.filter(function(clue){
    return used.indexOf(clue) === -1;
  });

  const source = available.length > 0 ? available : clues;
  const chosen = source[Math.floor(Math.random() * source.length)];
  used.push(chosen);
  return chosen;
}

function playTrack(trackKey, loop) {
  const audio = document.getElementById("bgm");
  const btn = document.getElementById("musicBtn");
  const nextSrc = AUDIO_TRACKS[trackKey];

  if (!nextSrc) return;
  if (!state.musicEnabled) return;

  const currentTrack = audio.getAttribute("data-track");
  if (currentTrack === trackKey) return;

  audio.pause();
  audio.src = nextSrc;
  audio.loop = loop;
  audio.setAttribute("data-track", trackKey);

  audio.play().then(function(){
    btn.textContent = "🔊 Música ON";
  }).catch(function(){
    btn.textContent = "⚠️ Sin audio";
  });
}

function stopMusic() {
  const audio = document.getElementById("bgm");
  audio.pause();
  audio.removeAttribute("data-track");
  audio.removeAttribute("src");
}

function getCurrentMusicContext() {
  if (state.gameState === "win") return "legend";
  if (activePlace) return "battle";
  return "city";
}

function updateRouteBar() {
  const bar = document.getElementById("rp");
  if (state.gameState === "start") {
    bar.style.display = "none";
    return;
  }

  bar.style.display = "flex";
  bar.innerHTML = '<span style="color:rgba(255,255,255,.45);font-size:.6rem;font-weight:900;flex-shrink:0;margin-right:3px">RUTA:</span>';

  state.secretRoute.forEach(function(c, i){
    if (i > 0) {
      const a = document.createElement("span");
      a.className = "rarr";
      a.textContent = "▶";
      bar.appendChild(a);
    }

    const d = document.createElement("div");
    if (i < state.routeIndex) {
      d.className = "rdot visited";
      d.textContent = CITY_POOL[c].emoji;
    } else if (i === state.routeIndex) {
      d.className = "rdot current";
      d.textContent = CITY_POOL[c].emoji;
    } else {
      d.className = "rdot unknown";
      d.textContent = "?";
    }
    d.title = c;
    bar.appendChild(d);
  });
}

function updatePokedex() {
  const dex = document.getElementById("pdx");
  dex.innerHTML = "";

  const seen = new Set(state.discovered);
  const fallback = RANDOM_POKEMON_POOL.map(function(p){ return p.name; }).filter(function(name){
    return !seen.has(name);
  }).slice(0, 6);

  const toShow = state.discovered.concat(fallback);
  const shown = new Set();

  toShow.forEach(function(name){
    if (shown.has(name)) return;
    shown.add(name);

    const s = document.createElement("div");
    const found = state.discovered.indexOf(name) !== -1;
    s.className = "pslot" + (found ? " found" : "");
    s.textContent = found ? ("🔴 " + name) : "❓ ???";
    dex.appendChild(s);
  });

  if (!dex.children.length) {
    for (let i = 0; i < 6; i++) {
      const s = document.createElement("div");
      s.className = "pslot";
      s.textContent = "❓ ???";
      dex.appendChild(s);
    }
  }
}

function getCityImage(cityKey) {
  const city = CITY_POOL[cityKey];
  if (city && city.cityImg) return city.cityImg;
  return "";
}

function getPlaceImage(cityKey, placeName) {
  const city = CITY_POOL[cityKey];
  if (!city || !city.places) return "";
  const place = city.places.find(function(p){ return p.name === placeName; });
  if (place && place.img) return place.img;
  return "";
}

function buildSceneHtml(label, imageUrl, extraHtml) {
  let html = '';
  html += '<div class="scene">';
  if (imageUrl) {
    html += '<img class="scene-bg" src="' + imageUrl + '" alt="' + label + '" onerror="this.style.display=\'none\'">';
  }
  html += '<div class="scene-pattern"></div>';
  if (extraHtml) html += extraHtml;
  html += '<div class="scene-label">📍 ' + label + '</div>';
  html += '</div>';
  return html;
}

function renderScreen() {
  const screen = document.getElementById("screen");
  const city = CITY_POOL[state.currentCity];

  activePlace = null;
  activePI = null;
  playTrack("city", true);

  document.getElementById("cb").textContent = city.country + " " + city.label;

  const routePos = state.secretRoute.indexOf(state.currentCity);
  const currentRouteCity = state.secretRoute[state.routeIndex];
  const nextRouteCity = getNextRouteCity();

  const isCurrent = state.currentCity === currentRouteCity;
  const isPast = routePos > -1 && routePos < state.routeIndex;
  const isCorrectNext = state.currentCity === nextRouteCity;
  const showNoSignal = !isCurrent && !isPast && !isCorrectNext;

  let html = '';
  const citySceneLabel = city.label.replace(/\(.*\)/,'').trim();
  const cityImage = getCityImage(state.currentCity);
  html += buildSceneHtml(citySceneLabel, cityImage, '');

  html += '<div class="stext">' + city.welcome + '</div>';

  if (showNoSignal) {
    html += '<div class="wbox">';
    html += '<div style="font-size:1.3rem">🔍</div>';
    html += '<div style="font-weight:900;color:var(--red);font-size:.95rem;margin:5px 0">¡Sin señal de energía!</div>';
    html += '<div style="font-size:.88rem">La Smart-Rotom está en silencio. El Pokémon legendario no ha pasado por aquí en este momento de la ruta. ¡Hay que seguir buscando!</div>';
    html += '</div>';
  } else if (isPast) {
    html += '<div class="hbox">✅ Ya completasteis la investigación aquí. En el modo repaso podréis volver a ver solo la pista conseguida en cada lugar.</div>';
    html += '<div class="opts">';
    state.activePlaces[state.currentCity].forEach(function(pl, i){
      html += '<button class="abtn" data-review="' + i + '">✅ ' + pl.name + '</button>';
    });
    html += '</div>';
  } else {
    html += '<div class="opts">';
    state.activePlaces[state.currentCity].forEach(function(pl, i){
      const done = state.donePlaces[state.currentCity] && state.donePlaces[state.currentCity].has(i);
      html += '<button class="abtn" data-place="' + i + '">' + (done ? ('✅ ' + pl.name) : ('🔍 Investigar: ' + pl.name)) + '</button>';
    });
    html += '</div>';
  }

  html += '<span class="slbl">🛫 Viajar a otra ciudad de la red:</span><div class="tgrid">';
  Object.keys(CITY_POOL).forEach(function(ck){
    if (ck === state.currentCity) return;
    const c = CITY_POOL[ck];
    const visited = state.secretRoute.indexOf(ck) < state.routeIndex && state.secretRoute.indexOf(ck) !== -1;
    const flagPart = c.emoji;
    html += '<button class="' + (ck === "Londres" ? 'lbtn' : 'tbtn') + '" data-city="' + ck + '">' + flagPart + ' ' + ck + (visited ? ' ✅' : '') + '</button>';
  });
  html += '</div>';

  screen.innerHTML = html;

  screen.querySelectorAll("[data-place]").forEach(function(btn){
    btn.addEventListener("click", function(){
      openPlace(Number(btn.getAttribute("data-place")), false);
    });
  });

  screen.querySelectorAll("[data-review]").forEach(function(btn){
    btn.addEventListener("click", function(){
      openPlace(Number(btn.getAttribute("data-review")), true);
    });
  });

  screen.querySelectorAll("[data-city]").forEach(function(btn){
    btn.addEventListener("click", function(){
      travelTo(btn.getAttribute("data-city"));
    });
  });
}

function travelTo(city) {
  state.currentCity = city;
  const nextCity = getNextRouteCity();
  if (city === nextCity) {
    state.routeIndex++;
    updateRouteBar();
  }
  renderScreen();
}

function renderReviewPlace(i) {
  const pl = state.activePlaces[state.currentCity][i];
  const assignedPokemon = getAssignedPokemon(state.currentCity, i);
  const review = state.reviewData[placeKey(state.currentCity, i)];
  const pokemonName = review && review.pokemonName ? review.pokemonName : assignedPokemon.name;
  const clueText = review && review.clueText ? review.clueText : "No hay pista guardada todavía.";
  const pokeUrl = "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/" + assignedPokemon.id + ".png";
  const scr = document.getElementById("screen");

  let html = '';
  const placeImage = getPlaceImage(state.currentCity, pl.name);
  html += buildSceneHtml(
    pl.name,
    placeImage,
    '<img class="poke-img" src="' + pokeUrl + '" alt="' + pokemonName + '">' +
    '<div class="poke-badge">⚡ ' + pokemonName + '</div>'
  );
  html += '<div class="stext">📘 <strong>Modo repaso:</strong> aquí os encontrasteis con <strong>' + pokemonName + '</strong>.</div>';
  html += '<div class="hbox">🗺️ <strong>Pista conseguida:</strong><br>' + clueText + '</div>';
  html += '<button class="tbtn" id="backBtn" style="margin-top:5px">⬅️ Volver</button>';

  scr.innerHTML = html;
  document.getElementById("backBtn").addEventListener("click", renderScreen);
}

function openPlace(i, reviewMode) {
  const places = state.activePlaces[state.currentCity];
  if (!places) {
    renderScreen();
    return;
  }

  const pl = places[i];
  const alreadyDone = state.donePlaces[state.currentCity] && state.donePlaces[state.currentCity].has(i);
  const routePos = state.secretRoute.indexOf(state.currentCity);
  const currentRouteCity = state.secretRoute[state.routeIndex];
  const nextRouteCity = getNextRouteCity();

  const isPast = routePos > -1 && routePos < state.routeIndex;
  const isCurrent = state.currentCity === currentRouteCity;
  const isCorrectNext = state.currentCity === nextRouteCity;

  if (reviewMode || isPast || alreadyDone) {
    renderReviewPlace(i);
    return;
  }

  if (!isCurrent && !isCorrectNext) {
    renderScreen();
    return;
  }

  activePlace = pl;
  activePI = i;
  playTrack("battle", true);

  const finalBattle = isFinalRouteCity(state.currentCity);
  const assignedPokemon = getAssignedPokemon(state.currentCity, i);
  const pokeName = finalBattle ? state.legendario.name : assignedPokemon.name;
  const pokePid = finalBattle ? state.legendario.id : assignedPokemon.id;
  const pokeUrl = "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/" + pokePid + ".png";

  const scr = document.getElementById("screen");

  let html = '';
  const placeImage = getPlaceImage(state.currentCity, pl.name);
  html += buildSceneHtml(
    pl.name,
    placeImage,
    '<img class="poke-img" src="' + pokeUrl + '" alt="' + pokeName + '">' +
    '<div class="poke-badge">⚡ ' + pokeName + '</div>'
  );
  html += '<div class="stext">¡En el monumento <strong>' + pl.name + '</strong> divisáis movimiento!<br>¡Ha aparecido un <strong>' + pokeName + '</strong> salvaje! Demostrad vuestra sabiduría:</div>';
  html += '<div class="stext" style="background:#e6f0ff;border-color:var(--yellow)">❓ ' + pl.q + '</div>';
  html += '<div class="opts">';
  pl.opts.forEach(function(opt, idx){
    html += '<button data-answer="' + idx + '">' + opt + '</button>';
  });
  html += '<button class="tbtn" id="backBtn" style="margin-top:5px">⬅️ Volver</button>';
  html += '</div>';

  scr.innerHTML = html;

  scr.querySelectorAll("[data-answer]").forEach(function(btn){
    btn.addEventListener("click", function(){
      checkAns(Number(btn.getAttribute("data-answer")));
    });
  });

  document.getElementById("backBtn").addEventListener("click", renderScreen);
}

function checkAns(idx) {
  const mo = document.getElementById("modal");
  const mt = document.getElementById("mt");
  const mx = document.getElementById("mx");
  const finalBattle = isFinalRouteCity(state.currentCity);

  if (state.donePlaces[state.currentCity] && state.donePlaces[state.currentCity].has(activePI)) {
    mt.textContent = "YA COMPLETADO ✅";
    mt.className = "mt ok";
    mx.innerHTML = "Este lugar ya había sido resuelto. En el modo repaso podéis volver a consultar solo la pista conseguida.";
    mo.classList.remove("hidden");
    return;
  }

  if (idx === activePlace.ans) {
    mt.textContent = "¡CORRECTO! 🎉";
    mt.className = "mt ok";

    if (!state.donePlaces[state.currentCity]) state.donePlaces[state.currentCity] = new Set();
    state.donePlaces[state.currentCity].add(activePI);

    const assignedPokemon = getAssignedPokemon(state.currentCity, activePI);
    const pokeName = finalBattle ? state.legendario.name : assignedPokemon.name;

    if (state.discovered.indexOf(pokeName) === -1) state.discovered.push(pokeName);
    updatePokedex();

    if (finalBattle) {
      mx.innerHTML = "🌟 ¡El imponente <strong>" + state.legendario.name + "</strong> desciende ante vosotros!<br><br>Asombrado por vuestra impecable cultura y conocimiento geográfico por toda España, ¡decide unirse voluntariamente a vuestro equipo!";
      state.gameState = "win";
    } else {
      const hint = "📡 <strong>Pista:</strong> " + getHintForCurrentCity();
      saveReviewData(state.currentCity, activePI, pokeName, hint);
      mx.innerHTML = hint;
    }
  } else {
    mt.textContent = "¡FALLO! ❌";
    mt.className = "mt ko";
    mx.innerHTML = "Esa respuesta no se corresponde con la realidad de este monumento histórico. ¡Pensadlo de nuevo!";
  }

  mo.classList.remove("hidden");
}

function closeModal() {
  document.getElementById("modal").classList.add("hidden");
  if (state.gameState === "win") {
    showWin();
  } else {
    renderScreen();
  }
}

function showWin() {
  playTrack("legend", false);

  const scr = document.getElementById("screen");
  const routeStr = state.secretRoute.map(function(c){
    return CITY_POOL[c].emoji + " <strong>" + c + "</strong>";
  }).join(" → ");
  const hasLondon = state.secretRoute.indexOf("Londres") !== -1;

  let html = '';
  html += '<div class="stext" style="text-align:center;background:#fff9db;border:3px solid var(--yellow);border-left:3px solid var(--yellow)">';
  html += '<div style="font-size:.95rem;color:var(--red);margin-bottom:12px;line-height:1.6;font-weight:900">🏆 ¡MAESTROS DE LA GEOGRAFÍA! 🏆</div>';
  html += '<p>¡Habéis descubierto la ruta secreta y capturado a <strong>' + state.legendario.name + '</strong>!</p>';
  html += '<div style="background:#fff;border-radius:10px;padding:11px;margin:10px 0;font-size:.82rem;line-height:2.1">La ruta aleatoria resuelta ha sido:<br>' + routeStr + '</div>';
  if (hasLondon) html += '<p style="color:#1a237e;font-weight:900">🇬🇧 ¡Eduardo Jr. celebra vuestro triunfo transfronterizo desde Londres!</p>';
  html += '<br><strong style="font-size:1rem">¡Enhorabuena, vuestro mapa está completo!</strong>';
  html += '</div>';
  html += '<button class="sbtn" id="restartBtn">🔄 NUEVA RUTA ALEATORIA</button>';

  scr.innerHTML = html;
  document.getElementById("cb").textContent = "🏆 ¡VICTORIA!";
  document.getElementById("restartBtn").addEventListener("click", restartGame);
}

function setupPlacesForGame() {
  state.secretRoute.forEach(function(c){
    const selectedPlaces = pick3Places(c).map(function(place){
      const chosenQuestion = chooseQuestion(place);
      return {
        name: place.name,
        q: chosenQuestion.q,
        opts: chosenQuestion.opts.slice(),
        ans: chosenQuestion.ans
      };
    });
    state.activePlaces[c] = selectedPlaces;
    state.donePlaces[c] = new Set();
  });
}

function startGame() {
  state.secretRoute = generateRoute();
  state.routeIndex = 0;
  state.currentCity = "Madrid";
  state.discovered = [];
  state.donePlaces = {};
  state.activePlaces = {};
  state.placePokemon = {};
  state.reviewData = {};
  state.usedHintsByCity = {};
  state.gameState = "explore";

  setupPlacesForGame();
  assignRandomPokemonToPlaces();
  state.legendario = LEGENDARIOS[Math.floor(Math.random() * LEGENDARIOS.length)];
  updatePokedex();
  updateRouteBar();
  renderScreen();
}

function restartGame() {
  state.secretRoute = [];
  state.routeIndex = 0;
  state.currentCity = "Madrid";
  state.discovered = [];
  state.activePlaces = {};
  state.donePlaces = {};
  state.placePokemon = {};
  state.reviewData = {};
  state.usedHintsByCity = {};
  state.gameState = "start";
  state.legendario = null;
  activePlace = null;
  activePI = null;

  stopMusic();

  document.getElementById("rp").style.display = "none";
  document.getElementById("cb").textContent = "—";
  document.getElementById("musicBtn").textContent = state.musicEnabled ? "🔊 Música ON" : "🔇 Música OFF";
  updatePokedex();

  const scr = document.getElementById("screen");
  let html = '';
  html += '<div style="display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px">';
  html += '<h2 style="font-size:.95rem;color:var(--blue);margin-bottom:12px;line-height:1.6">🔴 ¡AVENTURA GEOGRÁFICA v7.3!</h2>';
  html += '<div class="tcard">🧳 <strong>Un Pokémon Clandestino huye de nuevo</strong>. La Smart-Rotom ha detectado una ruta encriptada de <strong>5 ciudades</strong>. Tendréis que seguir pistas, visitar monumentos, responder preguntas y descubrir dónde se esconde el legendario antes de que vuelva a escapar.</div>';
  html += '<div class="tcard dark">🇬🇧 <strong style="color:#ffcc00">Eduardo Jr.</strong> está preparado en Londres por si aparece allí cualquier información importante sobre el Pokémon.</div>';
  html += '<button class="sbtn" id="startBtn">▶ ENCENDER SMART-ROTOM</button>';
  html += '</div>';
  scr.innerHTML = html;

  document.getElementById("startBtn").addEventListener("click", startGame);
}

function toggleMusic() {
  const audio = document.getElementById("bgm");
  const btn = document.getElementById("musicBtn");

  if (!state.musicEnabled) {
    state.musicEnabled = true;
    btn.textContent = "🔊 Música ON";

    const ctx = getCurrentMusicContext();
    if (ctx === "legend") {
      playTrack("legend", false);
    } else if (ctx === "battle") {
      playTrack("battle", true);
    } else {
      playTrack("city", true);
    }
  } else {
    state.musicEnabled = false;
    audio.pause();
    btn.textContent = "🔇 Música OFF";
  }
}

document.getElementById("modalBtn").addEventListener("click", closeModal);
document.getElementById("musicBtn").addEventListener("click", toggleMusic);
restartGame();
</script>
