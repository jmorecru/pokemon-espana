<head>

     necesita agrandar la letra. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
<div id="gc">
  <header>
    <h1>Pokémon España 🇪🇸</h1>
    <p>En busca del Legendario Clandestino</p>
  </header>

  <div id="sb">
    <span>📍 Ubicación:</span>
    <span id="cb">—</span>
  </div>

  <div id="top-actions">
    <span id="modo-badge" class="modo-badge hidden"></span>
    <button class="ctrl-btn" id="musicBtn">🔇 Música OFF</button>
  </div>

  <div id="reloj" class="hidden"></div>

  <div id="rp"></div>
  <div id="screen"></div>

  <div id="pdx-c">
    <div class="pdx-t">📱 Smart-Rotom: Pokémon Avistados</div>
    <div id="pdx"></div>
  </div>
</div>

<div id="modal" class="hidden">
  <div class="mc">
    <div id="mt" class="mt">Título</div>
    <div id="mx" class="mx">Texto</div>
    <button class="abtn" id="modalBtn" style="width:100%;justify-content:center">Continuar ▶</button>
  </div>
</div>

<script src="data/pokemon.js"></script>
<script src="data/pistas.js"></script>
<script src="data/ciudades.js"></script>
<script src="data/repaso.js"></script>
<script src="js/musica.js"></script>
<script src="js/juego.js"></script>
</body>
</html>
